name: Epic 限免通知

on:
  schedule:
    - cron: "6 22 * * *"
  workflow_dispatch:

concurrency:
  group: epic-orders-refresh
  cancel-in-progress: false

jobs:
  refresh-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Cache epic runtime state
        uses: actions/cache@v4
        with:
          path: |
            epic/epic_orders.json
            epic/epic_notification_state.json
          key: ${{ runner.os }}-epic-tracker-state-v1

      - name: Run Epic Games order tracker
        env:
          EPIC_COOKIE: ${{ secrets.EPIC_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          EPIC_FORCE_ORDER_REFRESH: ${{ secrets.EPIC_FORCE_ORDER_REFRESH }}
        run: python epic/epic_games_tracker.py

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic-run-output
          path: |
            epic/epic_orders.json
            epic/epic_notification_state.json
