name: 移动云盘每日签到

on:
  schedule:
    - cron: "6 2 * * *"
  workflow_dispatch:

concurrency:
  group: 139cloud-checkin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r 139cloud/mcloud_requirements.txt

      - name: Run daily check-in
        env:
          MCLOUD_COOKIES: ${{ secrets.MCLOUD_COOKIES }}
          MCLOUD_AUTH_ENCRYPTION_KEY: ${{ secrets.MCLOUD_AUTH_ENCRYPTION_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MCLD_DATA_DIR: 139cloud
        run: python 139cloud/mcloud_checkin.py

      - name: Commit refreshed account tokens
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 139cloud/mcloud_data.json
          if git diff --cached --quiet; then
            echo "No mobile cloud account state changes."
          else
            git commit -m "chore: refresh mobile cloud authorization"
            git push
          fi
