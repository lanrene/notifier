name: 移动云盘每日签到

on:
  schedule:
    - cron: "6 2 * * *"
  workflow_dispatch:

concurrency:
  group: 139cloud-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r 139cloud/mcloud_requirements.txt

      - name: Cache mcloud runtime state
        uses: actions/cache@v4
        with:
          path: 139cloud/mcloud_data.json
          key: ${{ runner.os }}-139cloud-state-v1

      - name: Run daily check-in
        env:
          MCLOUD_COOKIES: ${{ secrets.MCLOUD_COOKIES }}
          MCLOUD_AUTH_ENCRYPTION_KEY: ${{ secrets.MCLOUD_AUTH_ENCRYPTION_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MCLD_DATA_DIR: 139cloud
        run: python 139cloud/mcloud_checkin.py

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 139cloud-run-output
          path: 139cloud/mcloud_data.json
