name: Refresh Epic orders

on:
  schedule:
    # 06:06 Asia/Shanghai (UTC+8) is 22:06 UTC on the previous day.
    - cron: "6 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epic-orders-refresh
  cancel-in-progress: false

jobs:
  refresh-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh Epic orders
        env:
          EPIC_COOKIE: ${{ secrets.EPIC_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          EPIC_FORCE_ORDER_REFRESH: "1"
        run: python epic_games_tracker.py

      - name: Commit updated order data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- epic_orders.json
          if git diff --cached --quiet; then
            echo "epic_orders.json has no changes to commit."
          else
            git commit -m "chore: refresh Epic order data"
            git push
          fi
